[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "southpaw"
version = "0.1.0"
description = "Python wrapper for the southpaw CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "southpaw contributors" }]
keywords = ["security", "containers", "runtime", "posture"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/your-org/southpaw"
Repository = "https://github.com/your-org/southpaw"

[tool.hatch.build.targets.wheel]
packages = ["southpaw"]

