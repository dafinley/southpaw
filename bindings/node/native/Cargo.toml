[package]
name = "southpaw-node-native"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "N-API native binding for southpaw"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
southpaw-core = { path = "../../../crates/southpaw-core" }

[build-dependencies]
napi-build = "2"

