[workspace]
resolver = "2"
members = [
  "crates/southpaw",
  "crates/southpaw-core",
  "crates/southpaw-cli",
  "bindings/node/native",
  "bindings/deno/wasm",
]
default-members = [
  "crates/southpaw",
  "crates/southpaw-core",
  "crates/southpaw-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.77"
repository = "https://github.com/your-org/southpaw"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
