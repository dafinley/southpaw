name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test core
        run: cargo test -p secure-posture-core
      - name: Build CLI
        run: cargo build -p secure-posture-cli --release

  bindings-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node wrapper import smoke test
        run: node --input-type=module -e "import('./bindings/node/index.js').then(m => console.log(typeof m.checkPosture))"
      - name: Deno wrapper static check (placeholder)
        run: test -f bindings/deno/mod.ts

